{% set name = "libnpp" %}
{% set version = "12.4.1.87" %}
{% set cuda_version = "12.9" %}
{% set platform = "linux-x86_64" %}  # [linux64]
{% set platform = "linux-ppc64le" %}  # [ppc64le]
{% set platform = "linux-sbsa" %}  # [aarch64 and arm_variant_type=="sbsa"]
{% set platform = "linux-aarch64" %}  # [aarch64 and arm_variant_type=="tegra"]
{% set platform = "windows-x86_64" %}  # [win]
{% set target_name = "x86_64-linux" %}  # [linux64]
{% set target_name = "ppc64le-linux" %}  # [ppc64le]
{% set target_name = "sbsa-linux" %}  # [aarch64 and arm_variant_type=="sbsa"]
{% set target_name = "aarch64-linux" %}  # [aarch64 and arm_variant_type=="tegra"]
{% set target_name = "x64" %}  # [win]
{% set extension = "tar.xz" %}  # [not win]
{% set extension = "zip" %}  # [win]

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/cuda/redist/{{ name }}/{{ platform }}/{{ name }}-{{ platform }}-{{ version }}-archive.{{ extension }}
  sha256: 49351448d896854284ec708c14506eaaceb92aa01fbe35c91d5c52ad482e17ae  # [linux64]
  sha256: 992d461905366cec4243b26ce7bfe997c0c0eabf53a001333025930a1a0c7237  # [aarch64 and arm_variant_type=="sbsa"]
  sha256: 50c9f80592eaf4f246c82475143768b848333d9f540782257d42023f5fe68fdf  # [aarch64 and arm_variant_type=="tegra"]
  sha256: cfcfbf59e4e5ce71113c058bd4eba3dd56e4db080932146d4047c0d44b4a558e  # [win]

build:
  number: 0
  binary_relocation: false
  skip: true  # [osx]

requirements:
  build:
    - cf-nvidia-tools 1.*  # [linux]
    - patchelf <0.18.0     # [linux]

outputs:
  - name: libnpp
    build:
      binary_relocation: false
      missing_dso_whitelist:
        # Needed for the use of conda-build's --error-overlinking command-line argument
        - '*libgcc_s.so*'  # [linux]
      overlinking_ignore_patterns:
        # Workaround for LIEF's 'not a valid TAG' error
        - '*libnpp*.so*'  # [linux and aarch64]
    files:
      - lib/libnpp*.so.*                            # [linux]
      - targets/{{ target_name }}/lib/libnpp*.so.*  # [linux]
      - Library\bin\npp*.dll                        # [win]
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - {{ stdlib("c") }}
      host:
         - cuda-version {{ cuda_version }}
      run:
         - {{ pin_compatible("cuda-version", max_pin="x.x") }}
         - arm-variant * {{ arm_variant_type }}  # [aarch64]
    test:
      requires:
        - patchelf  # [linux]
      files:
        - test-rpath.sh
      commands:
        - test -L $PREFIX/lib/libnppc.so.{{ version }}                                          # [linux]
        - test -L $PREFIX/lib/libnppc.so.{{ version.split(".")[0] }}                            # [linux]
        - test -L $PREFIX/targets/{{ target_name }}/lib/libnppc.so.{{ version.split(".")[0] }}  # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/lib/libnppc.so.{{ version }}                # [linux]
        - bash test-rpath.sh                                                                    # [linux]
        - if not exist %LIBRARY_BIN%\nppc64_{{ version.split(".")[0] }}.dll exit 1              # [win]
    about:
      home: https://developer.nvidia.com/npp
      license: LicenseRef-NVIDIA-End-User-License-Agreement
      license_file: LICENSE
      license_url: https://docs.nvidia.com/cuda/eula/index.html
      license_family: Other
      summary: NPP native runtime libraries
      description: |
        NPP native runtime libraries
      doc_url: https://docs.nvidia.com/cuda/npp/index.html
      dev_url: https://docs.nvidia.com/cuda/npp/index.html

  - name: libnpp-dev
    build:
      run_exports:
        - {{ pin_subpackage("libnpp", max_pin="x") }}
    files:
      - lib/libnpp*.so                            # [linux]
      - lib/pkgconfig                             # [linux]
      - targets/{{ target_name }}/include         # [linux]
      - targets/{{ target_name }}/lib/libnpp*.so  # [linux]
      - targets/{{ target_name }}/lib/stubs       # [linux]
      - Library\include                           # [win]
      - Library\lib                               # [win]
    requirements:
      run:
        - libnpp >={{ version }}
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - {{ stdlib("c") }}
      host:
        - cuda-version {{ cuda_version }}
      run:
        - {{ pin_compatible("cuda-version", max_pin="x.x") }}
        - {{ pin_subpackage("libnpp", exact=True) }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
      run_constrained:
        - libnpp-static >={{ version }}      # [linux]
    test:
      commands:
        - test -L $PREFIX/lib/libnppc.so                                  # [linux]
        - test -f $PREFIX/lib/pkgconfig/nppc*.pc                          # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/include/npp.h         # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/lib/libnppc.so        # [linux]
        - test -f $PREFIX/targets/{{ target_name }}/lib/stubs/libnppc.so  # [linux]
        - if not exist %LIBRARY_INC%\npp.h exit 1                         # [win]
        - if not exist %LIBRARY_LIB%\nppc.lib exit 1                      # [win]
    about:
      home: https://developer.nvidia.com/npp
      license: LicenseRef-NVIDIA-End-User-License-Agreement
      license_file: LICENSE
      license_url: https://docs.nvidia.com/cuda/eula/index.html
      license_family: Other
      summary: NPP native runtime libraries
      description: |
        NPP native runtime libraries
      doc_url: https://docs.nvidia.com/cuda/npp/index.html
      dev_url: https://docs.nvidia.com/cuda/npp/index.html

  - name: libnpp-static
    build:
      skip: True  # [not linux]
    requirements:
      run:
        - libnpp-dev >={{ version }}
    files:
      - targets/{{ target_name }}/lib/libnpp*_static.a
    requirements:
      build:
        - {{ compiler("c") }}
        - {{ compiler("cxx") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
        - {{ stdlib("c") }}
      host:
        - cuda-version {{ cuda_version }}
      run:
        - {{ pin_compatible("cuda-version", max_pin="x.x") }}
        - arm-variant * {{ arm_variant_type }}  # [aarch64]
    test:
      commands:
        - test -f $PREFIX/targets/{{ target_name }}/lib/libnppc_static.a
    about:
      home: https://developer.nvidia.com/npp
      license: LicenseRef-NVIDIA-End-User-License-Agreement
      license_file: LICENSE
      license_url: https://docs.nvidia.com/cuda/eula/index.html
      license_fmaily: Other
      summary: NPP native runtime libraries
      description: |
        NPP native runtime libraries
      doc_url: https://docs.nvidia.com/cuda/npp/index.html
      dev_url: https://docs.nvidia.com/cuda/npp/index.html

about:
  home: https://developer.nvidia.com/npp
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_file: LICENSE
  license_url: https://docs.nvidia.com/cuda/eula/index.html
  license_family: Other
  summary: NPP native runtime libraries
  description: |
    NPP native runtime libraries
  doc_url: https://docs.nvidia.com/cuda/npp/index.html
  dev_url: https://docs.nvidia.com/cuda/npp/index.html

extra:
  recipe-maintainers:
    - conda-forge/cuda
  feedstock-name: libnpp
